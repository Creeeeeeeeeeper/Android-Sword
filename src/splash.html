<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        .splash-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #2a2d3a 0%, #1a1c24 100%);
            padding: 30px;
            gap: 30px;
        }

        .splash-image {
            width: 120px;
            height: 120px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .splash-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .splash-title {
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .splash-loading {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <img src="assets/Androidrobot.png" alt="Logo" class="splash-image">
        <div class="splash-info">
            <div class="splash-title">Android Sword</div>
            <div class="splash-loading">version 1.3.1</div>
            <div class="splash-loading">Loading...</div>
        </div>
    </div>

    <script>
        const { invoke } = window.__TAURI__.core;

        // 8秒后关闭启动窗口并显示主窗口
        setTimeout(async () => {
            try {
                await invoke('close_splash_show_main');
            } catch (e) {
                console.error('切换窗口失败:', e);
            }
        }, 5000);
    </script>
</body>
</html>
