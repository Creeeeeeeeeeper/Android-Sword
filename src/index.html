<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Android Screen Mirror - Scrcpy</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, #383B4A 0%, #24262D 100%);
      }

      #frame {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
    </style>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <iframe id="frame" src="pages/homepage/index.html"></iframe>

    <div id="error-container" style="display: none;">
      <div class="error-content">
        <h1>404</h1>
        <p>页面加载失败</p>
        <p id="error-url" class="error-url"></p>
        <button onclick="window.goBack()">返回上一页</button>
      </div>
    </div>

    <script>
      let loadTimeout;
      let currentUrl = 'pages/homepage/index.html';
      const frame = document.getElementById('frame');
      const errorContainer = document.getElementById('error-container');

      // 当前案件信息
      window.currentCaseNumber = null;
      window.currentCaseName = null;

      // 显示 404 错误界面
      function showError(failedUrl) {
        frame.style.display = 'none';
        errorContainer.style.display = 'flex';
        document.getElementById('error-url').textContent = `无法加载: ${failedUrl}`;
      }

      // 隐藏 404 错误界面
      function hideError() {
        frame.style.display = 'block';
        errorContainer.style.display = 'none';
      }

      // 监听 iframe 加载事件
      frame.addEventListener('load', function() {
        clearTimeout(loadTimeout);
        try {
          // 检查 iframe 中是否有内容
          if (this.contentDocument && this.contentDocument.body) {
            hideError();
          }
        } catch (e) {
          // 跨域时会抛出错误，视为加载成功
          hideError();
        }
      });

      // 监听 iframe 加载错误
      frame.addEventListener('error', function() {
        clearTimeout(loadTimeout);
        showError(currentUrl);
      });

      // 设置加载超时（10秒）
      frame.addEventListener('loadstart', function() {
        clearTimeout(loadTimeout);
        loadTimeout = setTimeout(function() {
          showError(currentUrl);
        }, 10000);
      });

      // 切换页面的接口函数
      window.loadPage = function(url) {
        if (!url) return;
        currentUrl = url;
        clearTimeout(loadTimeout);
        frame.src = url;
      };

      // 获取当前页面 URL
      window.getCurrentPage = function() {
        return currentUrl;
      };

      // 返回上一页
      window.goBack = function() {
        // 如果有历史记录，使用历史 API；否则返回默认首页
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.loadPage('pages/homepage/index.html');
        }
      };

      // 页面卸载时清理定时器
      window.addEventListener('beforeunload', function() {
        clearTimeout(loadTimeout);
      });

      // 监听来自 iframe 内页面的消息
      window.addEventListener('message', function(event) {
        // 检查消息来源（出于安全考虑）
        if (event.source !== frame.contentWindow) return;

        const data = event.data;

        // 处理 loadPage 请求
        if (data.action === 'loadPage' && data.url) {
          window.loadPage(data.url);
        }
        // 处理 getCurrentPage 请求
        else if (data.action === 'getCurrentPage') {
          frame.contentWindow.postMessage({
            action: 'currentPageResponse',
            url: currentUrl
          }, '*');
        }
        // 处理 goBack 请求
        else if (data.action === 'goBack') {
          window.goBack();
        }
      });
    </script>
  </body>
</html>
